<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:*; media-src 'self' blob:">
  <title>Pip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="shell">
    <div id="pill" class="pill" data-mode="input">
      <img id="pip" class="pip" data-state="idle" src="assets/pip/pip-idle.svg" alt="" draggable="false">
      <div class="pill-text">
        <input id="prompt" type="text" autocomplete="off" spellcheck="false"
               placeholder="Ask Pip anything…" aria-label="Request">
        <div class="task">
          <div id="title" class="title"></div>
          <div id="subtitle" class="subtitle" aria-live="polite"></div>
        </div>
      </div>
      <button id="close" class="close" title="Close (Esc)" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>
      </button>
      <button id="mic" class="mic" title="Talk to Pip (⌘⇧Space)" aria-label="Record">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
    </div>
    <section id="stack" class="stack"></section>
  </main>

  <template id="tpl-result">
    <article class="card result">
      <h2 class="headline"></h2>
      <p class="summary"></p>
      <ul class="rows"></ul>
      <footer class="foot">
        <div class="chips"></div>
        <div class="links">
          <button class="link" data-act="files" hidden>Show files</button>
          <button class="link" data-act="copy">Copy</button>
          <button class="link" data-act="open">Open sources</button>
        </div>
      </footer>
    </article>
  </template>

  <template id="tpl-plan">
    <article class="card plan">
      <header class="plan-head">
        <img class="pip small" src="assets/pip/pip-thinking.svg" alt="">
        <div>
          <h2 class="headline"></h2>
          <p class="touches"></p>
        </div>
      </header>
      <ol class="steps"></ol>
      <div class="buttons">
        <button class="btn" data-act="cancel">Cancel</button>
        <button class="btn primary" data-act="approve">Proceed</button>
      </div>
    </article>
  </template>

  <template id="tpl-setup">
    <article class="card setup">
      <header class="plan-head">
        <img class="pip small" src="assets/pip/pip-listening.svg" alt="">
        <div>
          <h2 class="headline">Set up Pip</h2>
          <p class="touches"></p>
        </div>
      </header>
      <ul class="perms"></ul>
      <div class="buttons">
        <button class="btn" data-act="later">Not now</button>
        <button class="btn primary" data-act="grant-all">Grant all</button>
      </div>
    </article>
  </template>

  <template id="tpl-alert">
    <article class="card alert">
      <header class="alert-head">
        <span class="app-icon"><img src="assets/pip/pip-alert.svg" alt=""></span>
        <span class="app-name">Pip</span>
        <span class="when">now</span>
      </header>
      <h3 class="alert-title"></h3>
      <p class="alert-body"></p>
      <div class="buttons">
        <button class="btn" data-useful="true">Useful</button>
        <button class="btn" data-useful="false">Not useful</button>
      </div>
    </article>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
