<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Pip notifications</title>
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <main id="toasts" aria-live="polite"></main>

  <template id="tpl-toast">
    <article class="toast" role="button" tabindex="-1">
      <header>
        <span class="app-icon"><img alt=""></span>
        <span class="app-name">Pip</span>
        <span class="when">now</span>
        <button class="dismiss" title="Dismiss" aria-label="Dismiss">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>
        </button>
      </header>
      <h3 class="title"></h3>
      <p class="body"></p>
      <div class="actions"></div>
    </article>
  </template>

  <script src="toast.js"></script>
</body>
</html>
